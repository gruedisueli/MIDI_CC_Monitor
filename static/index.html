<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <h2>MIDI CC Monitor</h2>
  <div id="charts"></div>
    <script>
    const socket = io({
        transports: ["websocket"],
        upgrade: false,
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 500,
    });

    socket.on("connect", () => {
    console.log("Socket connected:", socket.id);
    });

    const max_charts = 8;
    const max_measures = 8;
    const beats_per_measure = 4;
    const ticks_per_beat = 24;
    const max_ticks = max_measures * beats_per_measure * ticks_per_beat;
    let charts = {};
    let current_cc_vals = {};
    let active = [];
    let current_tick = 0;

    function createChart(cc) {
        const wrapper = document.createElement("div");
        wrapper.className = "chart-wrapper";

        const ctx = document.createElement("canvas");
        wrapper.appendChild(ctx);

        document.getElementById("charts").appendChild(wrapper);

        const annotations = {};
        for (let i = 0; i < max_ticks; i += ticks_per_beat) {
            annotations["beat" + i] = {
                type: "line",
                xMin: i,
                xMax: i,
                borderColor: "red",
                borderWidth: 1
            };
        }

        annotations["currentValue"] = {
            type: "line",
            yMin: 0,
            yMax: 0,
            borderColor: "blue",
            borderWidth: 1,
            borderDash: [6, 6]
        };

        annotations["currentTick"] = {
            type: "line",
            xMin: 0,
            xMax: 0,
            borderColor: "yellow",
            borderWidth: 3,
        };

        charts[cc] = new Chart(ctx, {
            type: "line",
            data: { datasets: [{ label: `CC ${cc}`, data: [] }] },
            options: {
                responsive: true,
                maintainAspectRatio: false,   // critical for filling parent
                animation: false,
                onResize: (chart, size) => {
                    const compact = size.height < 100;
                    chart.options.plugins.legend.position = compact ? "right" : "top";
                    chart.options.scales.x.ticks.display = !compact;
                    chart.options.scales.y.ticks.maxTicksLimit = compact ? 3 : 11;
                },
                scales: {
                    x: { type: "linear", min: 0, max: max_ticks },
                    y: { min: 0, max: 127 }
                },
                plugins: {
                    annotation: { annotations: annotations }
                }
            }
        });
    }

    function updateCharts(){
        //add the latest cc values to each graph
        Object.keys(charts).forEach(c => {
            const chart = charts[c]
            const v = current_cc_vals[c]
            if (chart.data.datasets[0].data.length <= current_tick){
                chart.data.datasets[0].data.push({x: current_tick, y: v})
            }
            else{
                chart.data.datasets[0].data[current_tick] = {x: current_tick, y: v}
            }
            chart.options.plugins.annotation.annotations["currentTick"].xMin = current_tick
            chart.options.plugins.annotation.annotations["currentTick"].xMax = current_tick
            chart.update()
        })
    }

    socket.on("stop", () => {
        current_tick = 0
        Object.values(charts).forEach(chart => {
            chart.data.datasets[0].data = []
            chart.update()
        })
    })

    socket.on("start", () => {
        current_tick = 0
        updateCharts()
    })

    socket.on("continue", () => {
        // do nothing
    })

    socket.on("update_tick", msg => {
        const {tick} = msg
        current_tick += 1
        if (current_tick >= max_ticks){
            current_tick = 0
        }
        updateCharts() //reduce overhead at high tempos
    });

    socket.on("update_cc", msg => {
        const {cc, val} = msg;
        
        //create new chart / purge old charts
        if (!active.includes(cc)){
            if (active.length >= max_charts){
                const old = active.shift()
                const oldChart = charts[old]
                const oldWrapper = oldChart.canvas.parentElement
                oldChart.destroy()
                oldWrapper.remove()
                delete charts[old]
                delete current_cc_vals[old]
            }
            active.push(cc)
            createChart(cc)
        }

        const v = parseInt(val)
        current_cc_vals[cc] = v
        const chart = charts[cc]
        chart.options.plugins.annotation.annotations["currentValue"].yMin = v
        chart.options.plugins.annotation.annotations["currentValue"].yMax = v
        chart.update()
    })

    </script>
</body>
<style>
html, body {
  height: 100%;
  margin: 0;
}

body {
  display: flex;
  flex-direction: column;
}

h2 {
  margin: 0;
  padding: 10px 20px;
  flex: 0 0 auto;
}

#charts {
  flex: 1 1 auto;                 /* takes remaining viewport height */
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px 20px 20px;
  box-sizing: border-box;
  overflow: hidden;               /* no scrolling */
}

.chart-wrapper {
  flex: 1 1 0;                    /* equal vertical space per chart */
  width: 100%;
  min-height: 0;
  position: relative;             /* Chart.js expects this */
}

.chart-wrapper canvas {
  width: 100% !important;
  height: 100% !important;        /* fill wrapper */
  display: block;
}


</style>

</html>
